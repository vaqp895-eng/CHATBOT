<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Asesor - TU EMPRESA</title>
    <style>
        :root {
            --primary: #33407b;
            --primary-dark: rgb(135, 85, 211);
            --secondary: #f093fb;
            --success: #4caf50;
            --danger: #ff5252;
            --warning: #ffc107;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-900: #0f172a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, var(--gray-50) 0%, var(--gray-100) 100%);
            color: var(--gray-700);
        }
        
        /* ===== LAYOUT PRINCIPAL ===== */
        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100vh;
            gap: 0;
        }
        
        /* ===== SIDEBAR (CHATS) ===== */
        .sidebar {
            background: white;
            border-right: 1px solid var(--gray-200);
            overflow-y: auto;
            box-shadow: inset -1px 0 0 var(--gray-200);
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-header h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--gray-700);
        }
        
        .sidebar-header span {
            background: var(--primary);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .btn-refrescar-chats {
            padding: 8px 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.2);
        }
        
        .btn-refrescar-chats:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 3px 12px rgba(102, 126, 234, 0.3);
        }
        
        .btn-refrescar-chats:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        
        .chat-item {
            padding: 12px 12px;
            margin: 4px 8px;
            background: var(--gray-50);
            border-left: 3px solid transparent;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .chat-item:hover {
            background: var(--gray-100);
            border-left-color: var(--primary);
            transform: translateX(4px);
        }
        
        .chat-item.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-left-color: var(--secondary);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .chat-item-numero {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 3px;
        }
        
        .chat-item-mensaje {
            font-size: 11px;
            opacity: 0.7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 4px;
        }
        
        .chat-item-footer {
            font-size: 10px;
            opacity: 0.6;
            display: flex;
            justify-content: space-between;
        }
        
        .chat-item.active .chat-item-mensaje,
        .chat-item.active .chat-item-footer {
            opacity: 0.95;
        }
        
        .empty-sidebar {
            padding: 40px 20px;
            text-align: center;
            color: var(--gray-400);
            font-size: 13px;
        }
        
        /* ===== MAIN (CHAT) ===== */
        .main {
            display: flex;
            flex-direction: column;
            background: white;
            overflow: hidden;
        }
        
        /* ===== HEADER ===== */
        .header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-200);
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.85;
        }
        
        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray-400);
            font-size: 14px;
        }

        /* ===== CHAT AREA ===== */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            background-color: #ece5dd;
        }
        .chat-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('/static/fondo_imagen.jpg');
            background-repeat: repeat;
            background-size: 160px;
            opacity: 0.06;
            background-attachment: scroll;
            pointer-events: none;
            z-index: 0;
        }

        .chat-area > * {
            position: relative;
            z-index: 1;
        }
        .message {
            margin-bottom: 16px;
            display: flex;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-start;
        }
        
        .message.assistant {
            justify-content: flex-end;
        }
        
        .message-bubble {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        
        .message.user .message-bubble {
            background: white;
            color: var(--gray-900);
            border: 1px solid var(--gray-200);
        }
        
        .message.assistant .message-bubble {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--gray-600);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--gray-200);
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .alert {
            padding: 10px 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .alert.show {
            opacity: 1;
        }
        
        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .input-field {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid var(--gray-300);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 80px;
            transition: all 0.2s;
            background: white;
        }
        
        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .input-field::placeholder {
            color: var(--gray-400);
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .btn-enviar {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            min-width: 110px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
            white-space: nowrap;
        }
        
        .btn-enviar:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        }
        
        .btn-enviar:active:not(:disabled) {
            transform: translateY(0);
        }
        
        .btn-enviar:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .char-count {
            font-size: 11px;
            color: var(--gray-400);
            margin-top: 4px;
        }
        
        /* ===== SCROLLBAR ===== */
        .chat-area::-webkit-scrollbar,
        .chats-list::-webkit-scrollbar {
            width: 6px;
        }
        
        /* ===== BOTÓN FINALIZAR ===== */
        .btn-finalizar {
            padding: 10px 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
            white-space: nowrap;
        }

        .btn-finalizar:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-finalizar:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-finalizar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .chat-area::-webkit-scrollbar-track,
        .chats-list::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-area::-webkit-scrollbar-thumb,
        .chats-list::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 3px;
        }
        /* ===== BOTONES SECUNDARIOS ===== */
        .btn-secundario {
            padding: 10px 14px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(245, 87, 108, 0.3);
            white-space: nowrap;
        }

        .btn-secundario:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
        }
        .btn-secundario:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
        }

        .btn-secundario:active {
            transform: translateY(0);
        }
        .btn-secundario:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn-secundario:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        /* ===== SUGERENCIAS IA ===== */
        #sugerencias-container {
            margin-bottom: 12px;
        }

        .sugerencia-btn {
            padding: 8px 10px;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: var(--gray-700);
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .sugerencia-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(139, 92, 246, 0.1), 
                rgba(236, 72, 153, 0.1),
                rgba(245, 158, 11, 0.1),
                rgba(16, 185, 129, 0.1),
                transparent);
            transition: left 0.6s ease;
        }

        .sugerencia-btn:hover {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.05), rgba(236, 72, 153, 0.05));
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.1);
        }

        .sugerencia-btn:hover::before {
            left: 100%;
        }

        .sugerencia-btn:active {
            transform: translateX(2px);
        }

        @keyframes borderFlow {
            0% { background-position: 0% 0%, 0% 0%; }
            100% { background-position: 0% 0%, 100% 0%; }
        }

        /* ===== ANIMACIÓN DE PULSO (cuando se hace click) ===== */
        .sugerencia-btn.clicked {
            animation: aiPulse 0.6s ease-out;
        }

        @keyframes aiPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(139, 92, 246, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(139, 92, 246, 0);
                transform: scale(1);
            }
        }

        /* ========================================================= */
        /* LO NUEVO: EFECTO MULTICOLOR DE CARGA (Añadido aquí abajo) */
        /* ========================================================= */

        @keyframes flujoBordeGemini {
            0% { background-position: 0% 50%, 0% 50%; }
            50% { background-position: 0% 50%, 100% 50%; }
            100% { background-position: 0% 50%, 0% 50%; }
        }

        @keyframes iaGiroSuave {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Cuando la IA está pensando, mantiene tu fondo blanco pero activa el borde mágico */
        .sugerencia-btn.btn-ia-loading {
            border: 1px solid transparent !important; 
            background: 
                linear-gradient(white, white) padding-box, 
                linear-gradient(90deg, #4285f4, #9b51e0, #e91e63, #fbbc05) border-box !important;
            background-size: 100% 100%, 300% 300% !important;
            animation: flujoBordeGemini 2s linear infinite !important;
            text-align: center !important; 
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.15);
            pointer-events: none; 
        }

        /* Animación exclusiva para el destello ✨ */
        .btn-ia-loading .ia-icon {
            display: inline-block;
            animation: iaGiroSuave 1.2s linear infinite;
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
<!-- ===== container ===== -->
<div class="container">
    <!-- ===== SIDEBAR (CHATS PENDIENTES) ===== -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>💬 Pendientes</h3>
            <button class="btn-refrescar-chats" onclick="cargarChats()">🔄 Refrescar</button>
        </div>
        
        <div id="chats" class="chats-list">
            <div class="empty-sidebar">Cargando chats...</div>
        </div>
    </div>  <!-- ← CIERRA SIDEBAR AQUÍ -->
    
    <!-- ===== MAIN (CHAT SELECCIONADO) ===== -->
    <div class="main">  
        <!-- Header -->
        <div class="header" id="header" style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
                <h2 id="header-numero">👨‍💼 Panel de Asesor</h2>
                <p id="header-empresa">Selecciona un chat para ver el historial</p>
            </div>
            <button id="btn-finalizar" class="btn-finalizar" onclick="finalizarConversacion()">
                ✅ Finalizar Chat
            </button>
        </div>
        
        <!-- Chat Area -->
        <div id="messages" class="chat-area">
            <div class="empty-state">Selecciona un chat para ver la conversación</div>
        </div>
        
        <!-- Input Area -->
        <div class="input-area" style="padding: 10px 16px;">
            
            <div id="sugerencias-container" style="margin-bottom: 8px; display: none;">
                <div id="sugerencias" style="display: flex; flex-direction: column; gap: 4px;"></div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <div style="display: flex; justify-content: flex-start;">
                    <button class="sugerencia-btn" onclick="cargarSugerencias()" title="Sugerencias IA">
                        ✨ IA
                    </button>
                </div>
                <div style="display: flex; gap: 8px; align-items: stretch;">
                    <textarea 
                        id="mensaje" 
                        class="input-field" 
                        placeholder="Escribe tu respuesta aquí..."
                        rows="3"
                        maxlength="4000"
                        style="flex: 1;min-height: 80px;"></textarea>          
                    <div style="display: flex; flex-direction: column;gap: 6px; justify-content: space-between;">
                        <div style="display: flex; gap: 6px;">
                            <button class="btn-secundario" onclick="enviarImagen()" title="Enviar imagen">
                                🖼️ Imagen
                            </button>
                            <button class="btn-secundario" onclick="enviarDocumento()" title="Enviar documento">
                                📄 Documento
                            </button>
                            <button class="btn-secundario" onclick="enviarUbicacion()" title="Enviar ubicación">
                                📍 Ubicación
                            </button>
                        </div>
                        <button id="btn-enviar" class="btn-enviar" onclick="enviarRespuesta()" style="width: 100%;">
                            📤 Enviar
                        </button>
                    </div> 
                </div>                
            </div>
            <div id="char-count" class="char-count"></div>
        </div>
    </div> 
</div> 
 
<script>
    const API_BASE = '';
    let chatsData = [];
    let numeroActual = null;
    let chatsLoadedOnce = false;
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.id = 'file-input';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);
    modoActualChat = "AUTO"; 
    let autoRefreshInterval = null;

    // ===== REFRESCAR CHATS MANUALMENTE =====
    async function refrescarChatsManual() {
        console.log('🔄 Refrescando...');
        const btn = document.querySelector('.btn-refrescar-chats');
        btn.disabled = true;
        
        try {
            const response = await fetch(`${API_BASE}/panel/chats`);
            if (!response.ok) throw new Error('Error');
            
            const data = await response.json();
            chatsData = data.chats || [];
            renderizarChats(chatsData);
        } catch (error) {
            console.error('❌ Error:', error);
        } finally {
            btn.disabled = false;
        }
    }
    // ===== CARGAR CHATS (SOLO UNA VEZ AL INICIAR) =====
    async function cargarChatsUnaVez() {
        if (chatsLoadedOnce) {
            console.log("⏭️  Chats ya cargados. Saltando...");
            return;
        }
        
        console.log('📊 Cargando chats por PRIMERA VEZ...');
        
        try {
            const response = await fetch(`${API_BASE}/panel/chats`);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            chatsData = data.chats || [];
            
            console.log(`✅ ${chatsData.length} chats cargados (UNA VEZ)`);
            renderizarChats(chatsData);

            
            chatsLoadedOnce = true;  // ← Marcar como cargado
        } catch (error) {
            console.error('❌ Error:', error);
        }
    }

    // ===== ENVIAR IMAGEN =====
    async function enviarImagen() {
        if (!numeroActual) {
            alert('Selecciona un chat primero');
            return;
        }
        fileInput.accept = 'image/*';
        fileInput.onchange = () => enviarArchivo('imagen'); // Al seleccionar, procesa la imagen
        fileInput.click();
    }

    async function enviarArchivo(tipo) {
        const file = fileInput.files[0];
        if (!file) return;

        // Usamos FormData para enviar el archivo real, no texto
        const formData = new FormData();
        formData.append('archivo', file);
        formData.append('numero', numeroActual);
        formData.append('tipo', tipo); // Recibe 'imagen' o 'documento'

        try {
            const response = await fetch(`${API_BASE}/panel/enviar-media`, {
                method: 'POST',
                body: formData // Sin JSON.stringify ni Content-Type manual
            });
            
            if (response.ok) {
                alert(`✅ ${tipo} enviado exitosamente`);
                fileInput.value = '';
                setTimeout(cargarChats, 2000);
            } else {
                alert(`❌ Error en el servidor al enviar ${tipo}`);
            }
        } catch (e) {
            alert(`❌ Error de red enviando ${tipo}`);
        }
    }
    async function enviarDocumento() {
        if (!numeroActual) {
            alert('Selecciona un chat primero');
            return;
        }
        fileInput.accept = '.pdf,.doc,.docx,.txt';
        fileInput.onchange = () => enviarArchivo('documento');
        fileInput.click();
    }

    async function enviarUbicacion() {
        if (!numeroActual) {
            alert('Selecciona un chat primero');
            return;
        }
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const url = `https://maps.google.com/?q=${lat},${lng}`;
                
                const mensaje = `📍 Ubicación: https://maps.google.com/?q=${lat},${lng}`;
                
                try {
                    const response = await fetch(`${API_BASE}/panel/responder`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ numero: numeroActual, mensaje })
                    });
                    
                    if (response.ok) {
                        alert('✅ Ubicación enviada');
                        document.getElementById('mensaje').value = '';
                        setTimeout(cargarChats, 2000);
                    }
                } catch (e) {
                    alert('❌ Error enviando ubicación');
                }
            });
        } else {
            alert('❌ Geolocalización no disponible');
        }
    }

    // ===== CARGAR CHATS =====
    async function cargarChats() {
        const alertDiv = document.getElementById('alert-chats');
        if (alertDiv) {
            alertDiv.classList.remove('show');
        }
        try {
            console.log('📊 Cargando chats pendientes...');
            const response = await fetch(`${API_BASE}/panel/chats`);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const data = await response.json();
            chatsData = data.chats || [];
            
            console.log(`✅ ${chatsData.length} chats pendientes cargados`);
            
            renderizarChats(chatsData);
            
            if (numeroActual) {
                console.log(`🔄 Refrescando chat actual: ${numeroActual}`);
                await cargarHistorial(numeroActual);
                console.log('✅ Chat refrescado');
            }
            
        } catch (error) {
            console.error('❌ Error:', error);
            mostrarAlerta('alert-chats', `❌ Error: ${error.message}`, 'error');
            document.getElementById('chats').innerHTML = `
                <div class="loading">
                    <p>❌ ${error.message}</p>
                    <p style="margin-top: 10px; font-size: 11px;">
                        Verifica que:<br>
                        • El servidor está corriendo<br>
                        • Google Sheets está conectado<br>
                        • Hay chats con estado "Pendiente Asesor"
                    </p>
                </div>
            `;
        }
    }
    
    // ===== FINALIZAR CONVERSACIÓN =====
    async function finalizarConversacion() {
        if (!numeroActual) {
            alert('No hay chat abierto');
            return;
        }
        
        if (!confirm('¿Cerrar esta conversación?')) return;
        
        const btn = document.getElementById('btn-finalizar');
        btn.disabled = true;
        
        try {
            const response = await fetch(`${API_BASE}/panel/modo`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    numero: numeroActual, 
                    modo: 'AUTO'
                })
            });
            
            if (response.ok) {
                alert('✅ Chat cerrado correctamente');
                numeroActual = null;
                actualizarAutoRefresh();
                document.getElementById('messages').innerHTML = 
                    '<div class="empty-state">Selecciona un chat para ver la conversación</div>';
                document.getElementById('header-numero').textContent = '👋 Panel de Asesor';
                document.getElementById('header-empresa').textContent = 'Selecciona un chat para ver el historial';
                document.getElementById('mensaje').value = '';
                document.getElementById('sugerencias-container').style.display = 'none';
            }
        } catch (error) {
            console.error('Error:', error);
            alert('❌ Error: ' + error.message);
        } finally {
            btn.disabled = false;
        }
    }

    // ===== RENDERIZAR CHATS =====
    function renderizarChats(chats) {
        const chatsDiv = document.getElementById('chats');
        
        if (!chats || chats.length === 0) {
            chatsDiv.innerHTML = '<div class="empty-chat">No hay chats pendientes</div>';
            return;
        }
 
        let html = '';
        chats.forEach(chat => {
            html += `
                <div class="chat-item" onclick="abrirChat('${chat.numero}')">
                    <div class="chat-item-numero">📱 ${chat.numero}</div>
                    <div class="chat-item-mensaje">${chat.mensaje}</div>
                    <div class="chat-item-footer">
                        <span>⏰ ${chat.hora}</span>
                        <span>${chat.modo}</span>
                    </div>
                </div>
            `;
        });
 
        chatsDiv.innerHTML = html;
    }
    // ===== AUTO-REFRESH INTELIGENTE =====
    function actualizarAutoRefresh() {
        // Limpiar interval anterior
        if (autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
        }
        
        // Si hay chat abierto → recargar SOLO ese chat
        if (numeroActual) {
            autoRefreshInterval = setInterval(() => {
                console.log("⏱️ Auto-refrescando historial del chat...");
                cargarHistorial(numeroActual);
            }, 60000);  // Cada 5 segundos
            console.log("✅ Auto-refresh ACTIVADO para historial");
        } else {
            // Si no hay chat → recargar lista de chats
            autoRefreshInterval = setInterval(() => {
                console.log("⏱️ Auto-refrescando lista de chats...");
                cargarChats();
            }, 14400000);  // Cada4 horas
            console.log("✅ Sin chat abierto. Sin auto-refresh.");
        }
    }
    // ===== ABRIR CHAT =====
    async function abrirChat(numero) {
        console.log(`📝 Abriendo chat de ${numero}...`);
        
        numeroActual = String(numero); 
        // Actualizar header
        document.getElementById('header-numero').textContent = `Chat selecionado : 📱 ${numero}`;

        const chat = chatsData.find(c => c.numero === numero);
        if (chat) {
            document.getElementById('header-empresa').textContent = `${chat.empresa} • ${chat.modo}`;
            }
 
        // Marcar como activo
        document.querySelectorAll('.chat-item').forEach(item => {
            item.classList.remove('active');
        });
        const activeChat = document.querySelector(`[onclick="abrirChat('${numero}')"]`);
        if (activeChat) activeChat.closest('.chat-item')?.classList.add('active');
 
        // Cargar historial
        await cargarHistorial(numero);
        actualizarAutoRefresh();
    }
 
    // ===== CARGAR HISTORIAL =====
    async function cargarHistorial(numero) {
        const messagesDiv = document.getElementById('messages');
        if (messagesDiv.innerHTML === '') {
            messagesDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando...</div>';
        }

 
        try {
            console.log(`📋 Obteniendo historial de ${numero}...`);
            const response = await fetch(`${API_BASE}/panel/chat/${numero}`);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
 
            const data = await response.json();
            const historial = data.historial || [];
 
            if (historial.length === 0) {
                messagesDiv.innerHTML = '<div class="empty-chat">Sin historial</div>';
                return;
            }
 
            let html = '';
            historial.forEach(msg => {
                const isUser = msg.role === 'user';
                const classe = isUser ? 'user' : 'assistant';
                const avatar = isUser ? 'IA/Usted' : 'Cliente';
 
                html += `
                    <div class="message ${classe}">
                        <div class="message-bubble">${msg.content}</div>
                    </div>
                `;
            });
 
            messagesDiv.innerHTML = html;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
 
            console.log(`✅ ${historial.length} mensajes cargados`);
 
        } catch (error) {
            console.error('❌ Error:', error);
            messagesDiv.innerHTML = `<div class="empty-chat">Error: ${error.message}</div>`;
        }
    }
 
    
    // ===== ENVIAR RESPUESTA (MEJORADO) =====
    async function enviarRespuesta() {
        const numero = numeroActual || document.getElementById('numero-select').value.trim();
        const mensaje = document.getElementById('mensaje').value.trim();
        const alertDiv = document.getElementById('alert-respuesta');
        const btn = document.getElementById('btn-enviar');
 
        // Validación
        if (!numero) {
            mostrarAlerta('alert-respuesta', '❌ Selecciona un chat primero', 'error');
            return;
        }
 
        if (!mensaje) {
            mostrarAlerta('alert-respuesta', '❌ Escribe un mensaje', 'error');
            return;
        }
        const textoOriginal = btn.textContent;
        // Desabilitar y mostrar animación
        btn.disabled = true;
        btn.style.opacity = '0.6';
        btn.innerHTML = '<span style="display:inline-block;animation:spin 0.8s linear infinite;margin-right:6px;">⏳</span>Enviando...';
        
        try {
            console.log(`📤 Enviando a ${numero}...`);
            
            const response = await fetch(`${API_BASE}/panel/responder`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ numero, mensaje })
            });
 
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || `HTTP ${response.status}`);
            }
 
            console.log('✅ Enviado');
            mostrarAlerta('alert-respuesta', '✅ Mensaje enviado a WhatsApp y guardado', 'success');
            document.getElementById('mensaje').value = '';
            document.getElementById('char-count').textContent = '';
 
            // Recargar historial del chat actual
            setTimeout(() => {
                cargarHistorial(numero);
            }, 1000);
 
        } catch (error) {
            console.error('❌ Error:', error);
            mostrarAlerta('alert-respuesta', `❌ ${error.message}`, 'error');
 
        } finally {
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.textContent = textoOriginal;
        }
    }

    // ===== SUGERENCIAS DE IA =====
    async function cargarSugerencias() {
        if (!numeroActual) {
            alert('Selecciona un chat primero');
            return;
        }
        
        const btn = document.querySelector('button[onclick="cargarSugerencias()"]');
        const contenidoOriginal = btn.innerHTML;
        btn.disabled = true;
        btn.classList.add('btn-ia-loading');
        btn.innerHTML = '<span class="ia-icon">✨</span>';
        
        try {
            const response = await fetch(`${API_BASE}/panel/sugerencias`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ numero: numeroActual })
            });
            
            if (!response.ok) throw new Error('Error cargando sugerencias');
            
            const data = await response.json();
            mostrarSugerencias(data.sugerencias || []);
            
        } catch (error) {
            console.error('Error:', error);
            alert('❌ Error cargando sugerencias');
        } finally {
            btn.disabled = false;
            btn.classList.remove('btn-ia-loading');
            btn.innerHTML = contenidoOriginal;
            }
    }
    function mostrarSugerencias(sugerencias) {
        const container = document.getElementById('sugerencias-container');
        const div = document.getElementById('sugerencias');
        
        div.innerHTML = '';
        
        sugerencias.slice(0, 2).forEach((sugerencia, index) => {
            const btn = document.createElement('button');
            btn.className = 'sugerencia-btn';
            btn.textContent = sugerencia;
            btn.type = 'button';
            btn.onclick = () => {
                // ✨ Animación de pulso
                btn.classList.add('clicked');
                setTimeout(() => btn.classList.remove('clicked'), 600);
                
                // Llenar textarea
                document.getElementById('mensaje').value = sugerencia;
                document.getElementById('char-count').textContent = `${sugerencia.length}/4000`;
                
                // Ocultar sugerencias después de seleccionar
                setTimeout(() => {
                    container.style.display = 'none';
                }, 600);
            };
            div.appendChild(btn);
        });
        
        container.style.display = 'block';
    }
    // ===== SELECCIONAR DESDE LISTA =====
    function seleccionarDesdeLista() {
        const numero = document.getElementById('numero-select').value;
        if (numero) {
            // Buscar el chat en la lista y abrirlo
            const chatItem = document.querySelector(`[data-numero="${numero}"]`);
            if (chatItem) {
                chatItem.click();
            } else {
                // Si no está en la lista, abrir de todas formas
                abrirChat(numero);
            }
        }
    }
 
    // ===== CONTADOR DE CARACTERES =====
    document.getElementById('mensaje')?.addEventListener('input', (e) => {
        const count = e.target.value.length;
        document.getElementById('char-count').textContent = `${count}/4000 caracteres`;
    });
 
    // ===== MOSTRAR ALERTA =====
    function mostrarAlerta(elementId, mensaje, tipo) {
        const alert = document.getElementById(elementId);
        if (!alert) return;
        alert.textContent = mensaje;
        alert.className = `alert show ${tipo}`;
        
        if (tipo === 'success') {
            setTimeout(() => {
                alert.classList.remove('show');
            }, 4000);
        }
    }
 
    // ===== INICIALIZAR =====
    document.addEventListener('DOMContentLoaded', () => {
        console.log('🚀 Panel iniciado');
        cargarChatsUnaVez();
    });
    // ===== ESTILOS PARA ANIMACIÓN SPINNER =====
    const styleSheet = document.createElement('style');
    styleSheet.textContent = `
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #btn-enviar, #btn-refrescar-chats {
        transition: opacity 0.2s ease, background-color 0.2s ease;
        }
        #btn-enviar {
            transition: opacity 0.2s ease;
        }
        #btn-enviar:disabled, #btn-refrescar-chats:disabled {
            cursor: not-allowed;
            opacity: 0.6 !important;
        }
    `;
    document.head.appendChild(styleSheet);
</script>
